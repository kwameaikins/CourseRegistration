name: Class reminders (frequent, 2h-before precision)

# Vercel Hobby caps cron jobs at 2 (both already used by /api/cron/reminders
# and /api/cron/attendance) and only fires once a day, which can't hit a
# "2 hours before class" window. This free external scheduler pings the new
# /api/cron/class-reminders-frequent route every 15 minutes instead — every
# send it triggers is deduped by its own log-table unique constraint, so
# overlapping/late-firing runs are safe.
#
# Setup required (external, one-time): add a repository secret named
# CRON_SECRET (Settings -> Secrets and variables -> Actions) with the same
# value as the CRON_SECRET environment variable set in Vercel. Also verify
# the URL below matches the deployed domain if it's not reg.knowsia.com.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  ping-class-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call class-reminders-frequent cron route
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://reg.knowsia.com/api/cron/class-reminders-frequent
